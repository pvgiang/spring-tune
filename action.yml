name: SpringTune check
description: "Catch risky Spring Boot configuration (pool exhaustion, hung threads, retry storms) and report it as SARIF."
branding:
  icon: shield
  color: green

inputs:
  path:
    description: "Project root to analyze (report paths are relative to it; keep the repository root for SARIF)."
    default: "."
  version:
    description: "SpringTune release to download, e.g. 0.4.0 (a release number only; anything else stops with exit code 2). The jar is verified against the release's SHA256SUMS before it runs."
    default: "0.4.0"
  profile:
    description: "Spring profile(s) to activate, comma-separated. Default: springtune.yml, else spring.profiles.active."
    default: ""
  fail-on:
    description: "ERROR, WARNING, INFO or NONE. Default: springtune.yml failOn, else ERROR."
    default: ""
  format:
    description: "Report formats to write (text, markdown, json, sarif)."
    default: "text,markdown,sarif"
  output:
    description: "Directory for report files."
    default: "springtune-reports"
  config:
    description: "Path to springtune.yml (default <path>/springtune.yml if present)."
    default: ""
  jar:
    description: "Use this CLI jar instead of downloading one (for testing unreleased builds). A local jar is not checksum-verified."
    default: ""
  token:
    description: "Token for downloading the release assets through the GitHub REST API (read access is enough). Default: the workflow's token. Empty, or a token that cannot read the release: anonymous curl over HTTPS, which needs the repository to be public. The token is never passed to the CLI."
    default: ${{ github.token }}

outputs:
  sarif:
    description: "Path to the SARIF report."
    value: ${{ steps.run.outputs.sarif }}
  exit-code:
    description: "0 = clean, 1 = findings at or above fail-on, 2 = usage or configuration error, or a failed download or checksum verification."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1; runs in users' workflows, so pinned
      with:
        distribution: temurin
        java-version: "21"
    - id: run
      shell: bash
      env:
        ST_PATH: ${{ inputs.path }}
        ST_VERSION: ${{ inputs.version }}
        ST_PROFILE: ${{ inputs.profile }}
        ST_FAIL_ON: ${{ inputs.fail-on }}
        ST_FORMAT: ${{ inputs.format }}
        ST_OUTPUT: ${{ inputs.output }}
        ST_CONFIG: ${{ inputs.config }}
        ST_JAR: ${{ inputs.jar }}
        ST_TOKEN: ${{ inputs.token }}
        ST_VERIFY: ${{ github.action_path }}/scripts/action/verify-sha256.sh
      run: |
        set -euo pipefail
        stop() { echo "::error::$1"; echo "exit-code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        jar="$ST_JAR"
        if [ -z "$jar" ]; then
          version="${ST_VERSION#v}"
          # A release number only: the version goes into URLs and paths, and curl resolves "../" in a URL, so an
          # unchecked value could fetch the jar and its SHA256SUMS from another repository.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || stop "Invalid version '$ST_VERSION': expected a SpringTune release number such as 0.4.0"
          base="https://github.com/pvgiang/spring-tune/releases/download/v$version"
          name="springtune-cli-$version.jar"
          dir="$RUNNER_TEMP/springtune-cli-$version"
          mkdir -p "$dir"
          jar="$dir/$name"
          rm -f "$jar" "$dir/SHA256SUMS"
          assets=""
          if [ -n "$ST_TOKEN" ] && command -v gh > /dev/null 2>&1; then
            # Through the REST API with a token: also works while the repository is private, and avoids the
            # anonymous rate limit. A token that cannot read the release (another GitHub host, expired, no access)
            # falls back to anonymous curl below, which works once the repository is public.
            export GH_TOKEN="$ST_TOKEN"
            assets="$(gh api "repos/pvgiang/spring-tune/releases/tags/v$version" --jq '.assets[] | "\(.id) \(.name)"')" \
              || { echo "::warning::Could not read release v$version through the API with the given token; trying anonymous download"; assets=""; }
          fi
          if [ -n "$assets" ]; then
            asset() { awk -v n="$1" '$2 == n { print $1 }' <<< "$assets"; }
            [ -n "$(asset "$name")" ] || stop "Release v$version has no $name"
            [ -n "$(asset SHA256SUMS)" ] || stop "Release v$version has no SHA256SUMS; refusing to run an unverified jar"
            gh api -H "Accept: application/octet-stream" "repos/pvgiang/spring-tune/releases/assets/$(asset "$name")" > "$jar" \
              || stop "Could not download $name from release v$version"
            gh api -H "Accept: application/octet-stream" "repos/pvgiang/spring-tune/releases/assets/$(asset SHA256SUMS)" > "$dir/SHA256SUMS" \
              || stop "Could not download SHA256SUMS from release v$version"
          else
            curl -fsSL --proto '=https' --retry 3 -o "$jar" "$base/$name" \
              || stop "Could not download $base/$name (is $version a SpringTune release?)"
            curl -fsSL --proto '=https' --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS" \
              || stop "Could not download $base/SHA256SUMS; refusing to run an unverified jar"
          fi
          [ -s "$dir/SHA256SUMS" ] || stop "Release v$version has no SHA256SUMS; refusing to run an unverified jar"
          [ -s "$jar" ] || stop "Release v$version has no $name"
          # Only the jar's line is checked. Any failure here stops the step before the jar runs.
          bash "$ST_VERIFY" "$jar" "$dir/SHA256SUMS" "$name" \
            || stop "Checksum verification of $name against $base/SHA256SUMS failed (see above); not running it"
        else
          echo "Using the local jar $jar (not checksum-verified)"
        fi
        # The jar never sees the download token.
        unset ST_TOKEN GH_TOKEN
        args=(check "$ST_PATH" --format "$ST_FORMAT" --output "$ST_OUTPUT")
        [ -n "$ST_PROFILE" ] && args+=(--profile "$ST_PROFILE")
        [ -n "$ST_FAIL_ON" ] && args+=(--fail-on "$ST_FAIL_ON")
        [ -n "$ST_CONFIG" ] && args+=(--config "$ST_CONFIG")
        set +e
        java -jar "$jar" "${args[@]}"
        code=$?
        set -e
        echo "sarif=$ST_OUTPUT/springtune-report.sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$ST_OUTPUT/springtune-report.md" ]; then cat "$ST_OUTPUT/springtune-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit "$code"
