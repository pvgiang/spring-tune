spring.application.name=payments
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.connectionTimeout=2000
spring.datasource.hikari.leakDetectionThreshold=${LEAK_DETECTION_MS}
resilience4j.retry.instances.gateway.max-attempts=4
resilience4j.retry.instances.gateway.wait-duration=200ms
resilience4j.circuitbreaker.instances.gateway.failure-rate-threshold=50
