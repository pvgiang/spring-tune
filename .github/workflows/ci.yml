name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the demo and the README snippets depend on things outside this repository (the published release,
    # Maven Central, the Plugin Portal), which can break without a commit here.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }}, Spring Boot 4.1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, unit tests, Maven plugin integration tests
        # Gradle plugin functional tests run in the 'gradle' job below, once per Gradle version.
        run: mvn -B -ntp verify -DskipITs

  gradle:
    name: Gradle plugin (Gradle ${{ matrix.gradle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.14.3", "9.8.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Functional tests (real Gradle builds apply the plugin by id from a staged repository)
        run: |
          gradle --version | grep "Gradle ${{ matrix.gradle }}"
          mvn -B -ntp verify -Dinvoker.skip -pl springtune-gradle-plugin-tests -am \
            -Dspringtune.it.requireGradle=true -Dspringtune.it.gradle="$(command -v gradle)"

  boot3:
    name: Compatibility (JDK 21, Spring Boot 3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Starter and sample against Spring Boot 3.5.x
        run: mvn -B -ntp verify -Dspring-boot.version=3.5.16 -Dinvoker.skip -DskipITs

  loadtests:
    name: Load tests (real PostgreSQL, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply mode under load against postgres:17-alpine (one pass, no retries)
        # requireDocker=true turns "no Docker" into a failure instead of a skip. docs/loadtests.md
        run: >
          mvn -B -ntp verify -pl springtune-loadtests -am -DskipITs -Dinvoker.skip
          -Dspringtune.it.requireDocker=true
      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtests-results
          path: |
            springtune-loadtests/target/loadtests/
            springtune-loadtests/target/surefire-reports/
          if-no-files-found: warn

  self-check:
    name: SpringTune check on the sample (demo)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: |
          mvn -B -ntp -q package -DskipTests -Dinvoker.skip -pl springtune-check-cli -am
          cp springtune-check-cli/target/springtune-check-cli-*-all.jar springtune-cli.jar
      - name: Run the GitHub Action on the sample (broken on purpose, so it must fail with exit code 1)
        id: springtune
        continue-on-error: true
        uses: ./
        with:
          path: springtune-samples/broken-config
          jar: springtune-cli.jar
          format: text,markdown,sarif
      - name: Expect exit code 1 and a SARIF report
        run: |
          test "${{ steps.springtune.outputs.exit-code }}" = "1"
          test -s "${{ steps.springtune.outputs.sarif }}"
      - uses: actions/upload-artifact@v4
        with:
          name: springtune-reports
          path: springtune-reports/

  install-strings:
    name: "Docs: no stale install strings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README, docs and examples show the current release only
        run: scripts/check-install-strings.sh

  action-checksum:
    name: "Action: checksum verification (real and tampered jar)"
    runs-on: ubuntu-latest
    env:
      VERSION: "0.4.0"
    steps:
      - uses: actions/checkout@v4
      - name: Download the released CLI jar and SHA256SUMS
        # Through the REST API with the workflow token, as the Action does: works while the repository is private.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          for name in "springtune-cli-$VERSION.jar" SHA256SUMS; do
            id="$(gh api "repos/pvgiang/spring-tune/releases/tags/v$VERSION" --jq ".assets[] | select(.name == \"$name\") | .id")"
            test -n "$id"
            gh api -H "Accept: application/octet-stream" "repos/pvgiang/spring-tune/releases/assets/$id" > "$name"
          done
          ls -l
      - name: The real jar verifies; tampered jars and bad checksum files are rejected
        run: >
          scripts/action/test-verify-sha256.sh
          "$RUNNER_TEMP/release/springtune-cli-$VERSION.jar" "$RUNNER_TEMP/release/SHA256SUMS"

  demo:
    name: "Demo: examples/broken-config-ci fails as documented"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The local Action with its defaults: downloads the released CLI, verifies it against SHA256SUMS, runs it.
      - name: Run the Action on the demo (must fail with exit code 1)
        id: demo
        continue-on-error: true
        uses: ./
        with:
          path: examples/broken-config-ci
          output: demo-reports
      - name: Expect exit code 1 and the four documented findings with line locations
        env:
          EXIT_CODE: ${{ steps.demo.outputs.exit-code }}
          SARIF: ${{ steps.demo.outputs.sarif }}
        run: |
          # 2 is a failed download or checksum, or a configuration error: a broken demo, not the expected red.
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::demo exit code '$EXIT_CODE', expected 1 (see examples/broken-config-ci/README.md)"
            exit 1
          fi
          python3 scripts/action/assert-sarif.py --tool-version 0.4.0 "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports
          path: demo-reports/
          if-no-files-found: warn

  # Executes the README's install snippets against Maven Central with empty local repositories. Not on every pull
  # request: each run downloads a few hundred MB from Central with no cache (that is the point), Central answers
  # bursts from shared runner IPs with 429, and a red check caused by a rate limit on an unrelated change teaches
  # people to ignore red. The install-strings job runs on every pull request and catches the common drift (a stale
  # version); this job proves the snippets still work after every merge to main, weekly, and on demand.
  readme-snippets:
    name: "README snippets: ${{ matrix.mode }} (Central, empty caches)"
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [maven, gradle-portal, gradle-central, cli]
    steps:
      - uses: actions/checkout@v4
      # Java 17: the supported baseline. No build-tool cache: the point is a fresh local repository.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: startsWith(matrix.mode, 'gradle')
        with:
          gradle-version: "9.8.2"
          cache-disabled: true
      - name: Build the README snippets in a fresh project
        env:
          MODE: ${{ matrix.mode }}
        run: SMOKE_WORK="$RUNNER_TEMP/readme-$MODE" scripts/smoke/readme-snippets.sh "$MODE"

  # The published tag, used as the README shows it. `uses:` cannot be read from the README, so the version is
  # repeated here; install-strings checks that the README pins the Action's default version.
  published-action:
    name: "README snippets: pvgiang/spring-tune@v0.4.0 on the demo"
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The v0.4.0 tag's Action downloads with anonymous curl, which gets 404 while the repository is private.
      - name: Check that the release is downloadable anonymously
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api repos/pvgiang/spring-tune --jq .private)"
          echo "public=$([ "$private" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$private" = false ] || echo "::notice::Repository is private: skipping the published-Action check until it is public"
      - name: Run the published Action on the demo (must fail with exit code 1)
        if: steps.visibility.outputs.public == 'true'
        id: published
        continue-on-error: true
        uses: pvgiang/spring-tune@v0.4.0
        with:
          version: "0.4.0"
          path: examples/broken-config-ci
          output: published-reports
      - name: Expect exit code 1 and the documented findings, written by CLI 0.4.0
        if: steps.visibility.outputs.public == 'true'
        env:
          EXIT_CODE: ${{ steps.published.outputs.exit-code }}
          SARIF: ${{ steps.published.outputs.sarif }}
        run: |
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::published Action exit code '$EXIT_CODE', expected 1"
            exit 1
          fi
          python3 scripts/action/assert-sarif.py --tool-version 0.4.0 "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10
