name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }}, Spring Boot 4.1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, unit tests, plugin integration tests
        run: mvn -B -ntp verify

  boot3:
    name: Compatibility (JDK 21, Spring Boot 3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Starter and sample against Spring Boot 3.5.x
        run: mvn -B -ntp verify -Dspring-boot.version=3.5.16 -Dinvoker.skip

  self-check:
    name: SpringTune check on the sample (demo)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -q package -DskipTests -Dinvoker.skip -pl springtune-check-cli -am
      - name: Run the CLI (the sample is broken on purpose, so the exit code must be 1)
        run: |
          set +e
          java -jar springtune-check-cli/target/springtune-check-cli-*-all.jar check springtune-samples/broken-config \
            --format text,markdown,sarif --output springtune-reports
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: springtune-reports
          path: springtune-reports/
