name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the demo and the README snippets depend on things outside this repository (the published release,
    # Maven Central, the Plugin Portal), which can break without a commit here.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }}, Spring Boot 4.1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, unit tests, Maven plugin integration tests
        # Gradle plugin functional tests run in the 'gradle' job below, once per Gradle version.
        run: mvn -B -ntp verify -DskipITs

  gradle:
    name: Gradle plugin (Gradle ${{ matrix.gradle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.14.3", "9.8.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Functional tests (real Gradle builds apply the plugin by id from a staged repository)
        run: |
          gradle --version | grep "Gradle ${{ matrix.gradle }}"
          mvn -B -ntp verify -Dinvoker.skip -pl springtune-gradle-plugin-tests -am \
            -Dspringtune.it.requireGradle=true -Dspringtune.it.gradle="$(command -v gradle)"

  boot3:
    name: Compatibility (JDK 21, Spring Boot 3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Starter and sample against Spring Boot 3.5.x
        run: mvn -B -ntp verify -Dspring-boot.version=3.5.16 -Dinvoker.skip -DskipITs

  loadtests:
    name: Load tests (real PostgreSQL, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply mode under load against postgres:17-alpine (one pass, no retries)
        # requireDocker=true turns "no Docker" into a failure instead of a skip. docs/loadtests.md
        run: >
          mvn -B -ntp verify -pl springtune-loadtests -am -DskipITs -Dinvoker.skip
          -Dspringtune.it.requireDocker=true
      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtests-results
          path: |
            springtune-loadtests/target/loadtests/
            springtune-loadtests/target/surefire-reports/
          if-no-files-found: warn

  self-check:
    name: SpringTune check on the sample (demo)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: |
          mvn -B -ntp -q package -DskipTests -Dinvoker.skip -pl springtune-check-cli -am
          cp springtune-check-cli/target/springtune-check-cli-*-all.jar springtune-cli.jar
      - name: Run the GitHub Action on the sample (broken on purpose, so it must fail with exit code 1)
        id: springtune
        continue-on-error: true
        uses: ./
        with:
          path: springtune-samples/broken-config
          jar: springtune-cli.jar
          format: text,markdown,sarif
      - name: Expect exit code 1 and a SARIF report
        run: |
          test "${{ steps.springtune.outputs.exit-code }}" = "1"
          test -s "${{ steps.springtune.outputs.sarif }}"
      - uses: actions/upload-artifact@v7
        with:
          name: springtune-reports
          path: springtune-reports/

  install-strings:
    name: "Docs: no stale install strings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: README, docs and examples show the current release only; pom above the last release
        run: scripts/check-install-strings.sh

  # The release scripts (iteration-7 brief rows 1 and 2): the Action stamp, the templated stale-version list, the
  # pom-version guard, and the install-version sweep as a dry run on a copy of this tree (--skip-central), after
  # which the install-strings guard and the claims check must pass. No network: Central's answers are faked there.
  release-scripts:
    name: "Release scripts: stamp, sweep dry run, stale-list and pom guards"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: stamp-action-version.sh
        run: scripts/release/test-stamp.sh
      - name: sweep-install-version.sh and check-install-strings.sh
        run: scripts/release/test-sweep.sh
      - name: release-commit.sh (the Release workflow's tag step, against a local bare origin)
        run: scripts/release/test-release-commit.sh

  action-checksum:
    name: "Action: checksum verification (real and tampered jar)"
    runs-on: ubuntu-latest
    env:
      # The release's SHA256SUMS also lists the SBOM, the Maven repository zip and LICENSE.txt: only the jar's line counts.
      VERSION: "0.4.1"   # sweep: current
    steps:
      - uses: actions/checkout@v7
      - name: Download the released CLI jar and SHA256SUMS
        # Through the REST API with the workflow token, as the Action does: works while the repository is private.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          for name in "springtune-cli-$VERSION.jar" SHA256SUMS; do
            id="$(gh api "repos/pvgiang/spring-tune/releases/tags/v$VERSION" --jq ".assets[] | select(.name == \"$name\") | .id")"
            test -n "$id"
            gh api -H "Accept: application/octet-stream" "repos/pvgiang/spring-tune/releases/assets/$id" > "$name"
          done
          ls -l
      - name: The real jar verifies; tampered jars and bad checksum files are rejected
        run: >
          scripts/action/test-verify-sha256.sh
          "$RUNNER_TEMP/release/springtune-cli-$VERSION.jar" "$RUNNER_TEMP/release/SHA256SUMS"

  demo:
    name: "Demo: examples/broken-config-ci fails as documented"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The local Action with its defaults: downloads the released CLI, verifies it against SHA256SUMS, runs it.
      - name: Run the Action on the demo (must fail with exit code 1)
        id: demo
        continue-on-error: true
        uses: ./
        with:
          path: examples/broken-config-ci
          output: demo-reports
      - name: Expect exit code 1 and exactly the documented findings with line locations
        env:
          EXIT_CODE: ${{ steps.demo.outputs.exit-code }}
          SARIF: ${{ steps.demo.outputs.sarif }}
          TOOL_VERSION: "0.4.1"   # sweep: current (main's action.yml default)
        run: |
          # 2 is a failed download or checksum, or a configuration error: a broken demo, not the expected red.
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::demo exit code '$EXIT_CODE', expected 1 (see examples/broken-config-ci/README.md)"
            exit 1
          fi
          # --exact: a new or moved finding fails too, since the demo README lists every finding (ST-TX-001 is INFO).
          python3 scripts/action/assert-sarif.py --tool-version "$TOOL_VERSION" --exact "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10 \
            ST-TX-001=src/main/resources/application.yml:1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-reports
          path: demo-reports/
          if-no-files-found: warn

  # The release stamp, proven on the pull request (iteration-7 brief row 2): a copy of this PR's Action, stamped by
  # the script release.yml uses for a tag's release commit with a released CLI other than main's default, runs
  # with NO `version:` input and must run that CLI. `demo` keeps proving the unstamped default. What this cannot
  # prove: a real tag. That is the `action-tag` job of post-release-smoke.yml, from the first stamped release on.
  action-stamped:
    name: "Action: a stamped copy runs its own CLI without version:"
    runs-on: ubuntu-latest
    env:
      # A released CLI whose jar is on its GitHub release, and never main's default. The sweep sets it to the
      # release it moves away from.
      STAMP_VERSION: "0.4.2"   # sweep: from
    steps:
      - uses: actions/checkout@v7
      - name: Copy the Action (action.yml and scripts/action) and stamp the copy
        run: |
          set -euo pipefail
          rm -rf .st-stamped
          mkdir -p .st-stamped/scripts
          cp action.yml .st-stamped/
          cp -r scripts/action .st-stamped/scripts/
          scripts/release/stamp-action-version.sh "$STAMP_VERSION" .st-stamped/action.yml
          main_default="$(awk '/^inputs:/ {i=1; next} i && /^[^ ]/ {i=0} i && /^  version:/ {v=1; next} v && /^  [^ ]/ {v=0}
            v && /^    default:/ {gsub(/[" ]|default:/, ""); print; exit}' action.yml)"
          if [ "$main_default" = "$STAMP_VERSION" ]; then
            echo "::error::STAMP_VERSION $STAMP_VERSION equals main's default: this job would prove nothing"
            exit 1
          fi
          # The copy differs from action.yml in the version input's description and default lines only.
          diff action.yml .st-stamped/action.yml || true
          test "$( (diff action.yml .st-stamped/action.yml || true) | grep -c '^>')" -le 2
      - name: Run the stamped copy on the demo, no version input (must fail with exit code 1)
        id: stamped
        continue-on-error: true
        uses: ./.st-stamped
        with:
          path: examples/broken-config-ci
          output: stamped-reports
      - name: Expect exit code 1 and the demo's findings, written by the stamped CLI
        env:
          EXIT_CODE: ${{ steps.stamped.outputs.exit-code }}
          SARIF: ${{ steps.stamped.outputs.sarif }}
        run: |
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::stamped Action exit code '$EXIT_CODE', expected 1"
            exit 1
          fi
          python3 scripts/action/assert-sarif.py --tool-version "$STAMP_VERSION" --exact "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10 \
            ST-TX-001=src/main/resources/application.yml:1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stamped-reports
          path: stamped-reports/
          if-no-files-found: warn

  # Executes the README's install snippets against Maven Central with empty local repositories. Not on every pull
  # request: each run downloads a few hundred MB from Central with no cache (that is the point), Central answers
  # bursts from shared runner IPs with 429, and a red check caused by a rate limit on an unrelated change teaches
  # people to ignore red. The install-strings job runs on every pull request and catches the common drift (a stale
  # version); this job proves the snippets still work after every merge to main, weekly, and on demand.
  readme-snippets:
    name: "README snippets: ${{ matrix.mode }} (Central, empty caches)"
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [maven, gradle-portal, gradle-central, cli]
    steps:
      - uses: actions/checkout@v7
      # First: is the version the README installs on Maven Central at all? A release is tagged on GitHub before its
      # Central deployment is published (a human presses Publish), so after a version sweep this job is red until
      # then. It fails with the reason and never skips or passes; a re-run after Publish turns it green.
      - name: The README's SpringTune version is on Maven Central
        run: |
          set -euo pipefail
          v="$(python3 -I scripts/smoke/readme-snippet.py README.md cli \
            | sed -n 's:.*springtune-check-cli-\([0-9][0-9A-Za-z.-]*[0-9A-Za-z]\)-all\.jar.*:\1:p' | sort -u)"
          [ "$(printf '%s\n' "$v" | grep -c .)" -eq 1 ] \
            || { echo "::error file=README.md::snippet:cli should name exactly one SpringTune version, found '$(echo $v)'"; exit 1; }
          url="https://repo1.maven.org/maven2/io/github/winkytek/springtune/springtune-check-cli/$v/springtune-check-cli-$v.pom"
          # Only a 404 means "not published"; a 429 or 5xx (Central rate-limits shared runner IPs) is a failed check.
          code="$(curl -sSI -o /dev/null -w '%{http_code}' --proto '=https' --retry 3 "$url" || true)"
          if [ "$code" = 404 ]; then
            echo "::error::SpringTune $v is not on Maven Central yet: press Publish on central.sonatype.com (iteration-6 brief §3, H2), then re-run this job"
            exit 1
          elif [ "$code" != 200 ]; then
            echo "::error::Could not check Maven Central for SpringTune $v (HTTP '$code' for $url): re-run this job"
            exit 1
          fi
          echo "SpringTune $v is on Maven Central: $url"
      # Java 17: the supported baseline. No build-tool cache: the point is a fresh local repository.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: startsWith(matrix.mode, 'gradle')
        with:
          gradle-version: "9.8.2"
          cache-disabled: true
      - name: Build the README snippets in a fresh project
        env:
          MODE: ${{ matrix.mode }}
        run: SMOKE_WORK="$RUNNER_TEMP/readme-$MODE" scripts/smoke/readme-snippets.sh "$MODE"

  # The published tag, used as the README shows it. `uses:` cannot be read from the README, so the version is
  # repeated here (lines with a "sweep: current" comment are moved by scripts/release/sweep-install-version.sh);
  # install-strings checks that the README pins the Action's default version. The Action downloads the release
  # through the REST API with the workflow token.
  published-action:
    name: "README snippets: pvgiang/spring-tune@v0.4.1 on the demo"   # sweep: current
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the published Action on the demo (must fail with exit code 1)
        id: published
        continue-on-error: true
        uses: pvgiang/spring-tune@v0.4.1   # sweep: current
        # version: passed as the README does: tags before v0.4.3 default to the previous release's CLI.
        with:
          version: "0.4.1"   # sweep: current
          path: examples/broken-config-ci
          output: published-reports
      - name: Expect exit code 1 and the documented findings, written by the pinned CLI
        env:
          EXIT_CODE: ${{ steps.published.outputs.exit-code }}
          SARIF: ${{ steps.published.outputs.sarif }}
          TOOL_VERSION: "0.4.1"   # sweep: current
        run: |
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::published Action exit code '$EXIT_CODE', expected 1"
            exit 1
          fi
          # --exact: a new or moved finding fails too, since the demo README lists every finding (ST-TX-001 is INFO).
          python3 scripts/action/assert-sarif.py --tool-version "$TOOL_VERSION" --exact "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10 \
            ST-TX-001=src/main/resources/application.yml:1
