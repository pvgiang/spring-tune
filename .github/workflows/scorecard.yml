name: OpenSSF Scorecard

# Supply-chain checks (branch protection, pinned dependencies, token permissions, signed releases, ...).
# Results go to the Security tab (code scanning) and the run's artifacts; nothing is published to the
# Scorecard API, and there is no README badge until the score is 7 or higher (iteration-5 brief, challenge 10).
on:
  schedule:
    - cron: "17 5 * * 1"      # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.repository == 'pvgiang/spring-tune'
    permissions:
      security-events: write  # upload the SARIF to code scanning
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Two runs of the same checks: JSON for the score in the job summary (the log of record), SARIF for the
      # Security tab. With a fine-grained PAT (secret SCORECARD_TOKEN, read-only: Administration, Contents, Metadata)
      # the Branch-Protection check can read the rules; without it that check is reported as unavailable and the
      # others still run.
      - name: Run Scorecard (JSON)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Run Scorecard (SARIF)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Score in the job summary
        run: |
          {
            echo "## OpenSSF Scorecard: $(jq -r '.score' scorecard.json) / 10"
            echo
            echo "Badge only at 7 or higher (docs/delivery/iteration-5-brief.md, challenge 10)."
            echo
            echo "| Check | Score | Reason |"
            echo "|---|---|---|"
            jq -r '.checks | sort_by(.score) | .[] | "| \(.name) | \(if .score < 0 then "n/a" else .score end) | \(.reason | gsub("\\|"; "/")) |"' scorecard.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: |
            scorecard.json
            scorecard.sarif
          retention-days: 90

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
