name: Post-release smoke

# After a release is live: a clean Maven project and clean Gradle builds install SpringTune VERSION from Maven
# Central and the Gradle Plugin Portal, with empty local repositories and no mavenLocal(). See
# docs/releasing.md#post-release-smoke. Run it by hand (Actions > Post-release smoke > Run workflow) after the
# Plugin Portal workflow, or call it from another workflow. Each job first waits (up to 30 min) until the files
# are visible on Central/the Portal; the builds themselves are never retried. The `action-tag` job runs the
# GitHub Action at the tag vVERSION without a `version:` input (meaningful from 0.4.3, the first stamped tag).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without the leading v (e.g. 0.4.0)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "Released version, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  maven-smoke:
    name: Maven (Central)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      # Java 17: the supported baseline. No Maven cache: the point is a fresh local repository.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Smoke
        env:
          VERSION: ${{ inputs.version }}
          WAIT_MINUTES: "30"
        run: SMOKE_WORK="$RUNNER_TEMP/smoke-maven" scripts/smoke/maven-smoke.sh "${VERSION#v}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-smoke-reports
          path: |
            ${{ runner.temp }}/smoke-maven/project/target/springtune/
            ${{ runner.temp }}/smoke-maven/project/target/surefire-reports/
            ${{ runner.temp }}/smoke-maven/*.log
            ${{ runner.temp }}/smoke-maven/*.txt
          if-no-files-found: ignore
          retention-days: 14

  gradle-smoke:
    name: Gradle ${{ matrix.gradle }}, plugin from ${{ matrix.plugin-repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.14.3", "9.8.2"]
        plugin-repo: [portal, central]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-disabled: true
      - name: Smoke
        env:
          VERSION: ${{ inputs.version }}
          PLUGIN_REPO: ${{ matrix.plugin-repo }}
          WAIT_MINUTES: "30"
        run: SMOKE_WORK="$RUNNER_TEMP/smoke-gradle" scripts/smoke/gradle-smoke.sh "${VERSION#v}" "$PLUGIN_REPO"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gradle-smoke-${{ matrix.gradle }}-${{ matrix.plugin-repo }}
          path: |
            ${{ runner.temp }}/smoke-gradle/project/build/springtune/
            ${{ runner.temp }}/smoke-gradle/*.log
            ${{ runner.temp }}/smoke-gradle/*.txt
          if-no-files-found: ignore
          retention-days: 14

  # The tag runs its own CLI (iteration-7 brief row 2): the tag vVERSION, checked out into a directory as a user's
  # `uses: pvgiang/spring-tune@vVERSION` fetches it, runs on the demo with NO `version:` input and must write SARIF
  # from CLI VERSION. This proves the stamp only for tags made by the stamping Release workflow (dispatch), i.e.
  # from 0.4.3 on. The v0.4.2 and older tags default to the previous release's CLI: for those the job checks that
  # documented state (the tag's default is not VERSION), says so in a notice and runs nothing, so that the smoke run
  # for 0.4.2 (H1) can be green. From 0.4.3 on, a tag that does not default to VERSION fails.
  action-tag:
    name: "Action: the tag without version: runs its own CLI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release number only
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::invalid version '$VERSION'"; exit 1; }
          echo "TAG_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: v${{ env.TAG_VERSION }}
          path: .st-tag
          persist-credentials: false
      - name: The tagged action.yml's default
        run: |
          set -euo pipefail
          default="$(awk '/^inputs:/ {i=1; next} i && /^[^ ]/ {i=0} i && /^  version:/ {v=1; next} v && /^  [^ ]/ {v=0}
            v && /^    default:/ {gsub(/[" '"'"']|default:/, ""); print; exit}' .st-tag/action.yml)"
          echo "tag v$TAG_VERSION is commit $(git -C .st-tag rev-parse HEAD); its action.yml defaults to CLI '$default'"
          first_stamped=0.4.3   # the first release whose tag the Release workflow stamps (iteration-7 brief row 2)
          if [ "$default" = "$TAG_VERSION" ]; then
            echo "RUN_TAG=true" >> "$GITHUB_ENV"
          elif [ "$(printf '%s\n%s\n' "$TAG_VERSION" "$first_stamped" | sort -V | head -1)" != "$first_stamped" ]; then
            echo "::notice::v$TAG_VERSION predates the stamped tags (from v$first_stamped): it defaults to CLI $default, as documented; nothing to run"
            echo "RUN_TAG=false" >> "$GITHUB_ENV"
          else
            echo "::error::v$TAG_VERSION's action.yml defaults to CLI '$default', not $TAG_VERSION: the tag was not stamped"
            exit 1
          fi
      - name: Run the tag on the demo, no version input (must fail with exit code 1)
        id: tag
        if: env.RUN_TAG == 'true'
        continue-on-error: true
        uses: ./.st-tag
        with:
          path: examples/broken-config-ci
          output: tag-reports
      - name: Expect exit code 1 and the demo's findings, written by the tag's CLI
        if: env.RUN_TAG == 'true'
        env:
          EXIT_CODE: ${{ steps.tag.outputs.exit-code }}
          SARIF: ${{ steps.tag.outputs.sarif }}
        run: |
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::Action at v$TAG_VERSION: exit code '$EXIT_CODE', expected 1"
            exit 1
          fi
          # The demo and assert-sarif.py come from the default branch's checkout.
          python3 scripts/action/assert-sarif.py --tool-version "$TAG_VERSION" --exact "$SARIF" \
            ST-HIKARI-001=src/main/resources/application.yml:9 \
            ST-HIKARI-002=src/main/resources/application.yml:1 \
            ST-TOMCAT-001=src/main/resources/application.yml:15 \
            ST-HTTP-001=src/main/java/com/example/orders/InventoryClient.java:10 \
            ST-TX-001=src/main/resources/application.yml:1
      - uses: actions/upload-artifact@v7
        if: always() && env.RUN_TAG == 'true'
        with:
          name: action-tag-reports
          path: tag-reports/
          if-no-files-found: warn
