name: Release

# Two ways to release; both build, test and publish a GitHub Release with notes from docs/releases/v<version>.md:
#   1. push a tag:   git tag -a v0.1.0 -m "SpringTune 0.1.0" && git push origin v0.1.0
#   2. Actions > Release > Run workflow, enter the version; the tag is created on the selected commit.
# Maven Central (job 'maven-central') runs only when the repository secrets in docs/releasing.md exist;
# without them the job is skipped and the release is GitHub-only, as before.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      central: ${{ steps.central.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Invalid version: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      # Secrets cannot be used in a job-level 'if', so this step turns "are they all set?" into a job output.
      - name: Maven Central configured?
        id: central
        env:
          HAS_SECRETS: ${{ secrets.CENTRAL_USERNAME != '' && secrets.CENTRAL_PASSWORD != '' && secrets.GPG_SECRET_KEY != '' && secrets.GPG_PUBLIC_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        run: |
          echo "enabled=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Maven Central secrets not set: publishing to GitHub Releases only (see docs/releasing.md)."
          fi

      - name: Build and test (all modules, Maven plugin ITs; Gradle plugin functional tests are gated by CI)
        run: mvn -B -ntp verify -DskipITs

      # -Prelease adds -sources and -javadoc jars (Maven Central needs them); the same staging repository becomes
      # the zip asset and, in the next job, the Maven Central bundle.
      - name: Stage Maven artifacts
        run: mvn -B -ntp -Prelease deploy -DskipTests -Dinvoker.skip -DaltDeploymentRepository=staging::file:${{ github.workspace }}/target/staging-repo

      - name: Keep the staging repository for the Maven Central job
        uses: actions/upload-artifact@v4
        with:
          name: staging-repo
          path: target/staging-repo
          retention-days: 7

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp springtune-check-cli/target/springtune-check-cli-$VERSION-all.jar dist/springtune-cli-$VERSION.jar
          (cd target/staging-repo && zip -qr ../../dist/springtune-maven-repo-$VERSION.zip .)
          (cd dist && sha256sum * > SHA256SUMS)
          java -jar dist/springtune-cli-$VERSION.jar --version | grep -q "SpringTune $VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          test -f "$NOTES"
          # On workflow_dispatch the tag does not exist yet; --target creates it on the built commit.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "SpringTune $VERSION" --notes-file "$NOTES"

  maven-central:
    name: Publish to Maven Central
    needs: release
    if: needs.release.outputs.central == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version (JReleaser reads it from the POM)
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - uses: actions/download-artifact@v4
        with:
          name: staging-repo
          path: target/staging-repo

      # Signs every file in memory (no gpg agent), adds checksums, runs Central's POM/sources/javadoc rules and
      # uploads one bundle. Stage defaults to UPLOAD: the deployment then waits on central.sonatype.com for a human
      # to press Publish. Set the repository variable CENTRAL_STAGE=FULL to publish without that step.
      - name: Deploy with JReleaser
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_STAGE: ${{ vars.CENTRAL_STAGE || 'UPLOAD' }}
        run: mvn -B -ntp -Prelease -N jreleaser:deploy -Dspringtune.central.stage="$CENTRAL_STAGE"

      - name: JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: target/jreleaser/
          retention-days: 7
