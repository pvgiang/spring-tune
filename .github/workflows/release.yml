name: Release

# Two ways to release; both build, test and publish a GitHub Release with notes from docs/releases/v<version>.md:
#   1. Actions > Release > Run workflow, enter the version (the normal path). After the build and tests, the job
#      makes a one-file release commit on top of the built commit, in which action.yml's `version` default is the
#      released version (scripts/release/stamp-action-version.sh), pushes it as the tag vX.Y.Z and creates the
#      release on that tag. So `uses: pvgiang/spring-tune@vX.Y.Z` (or its commit SHA) runs CLI X.Y.Z without a
#      `version:` input. The release commit is reachable only from the tag; main keeps the README's pin.
#   2. push a tag:   git tag -a vX.Y.Z -m "SpringTune X.Y.Z" && git push origin vX.Y.Z
#      A pushed tag cannot be re-pointed, so the job fails unless the tagged action.yml already defaults to X.Y.Z.
# Maven Central (job 'maven-central') runs only when the repository secrets in docs/releasing.md exist;
# without them the job is skipped and the release is GitHub-only, as before. It builds from the built commit and
# the staged artifacts; it does not read action.yml. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      central: ${{ steps.central.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Invalid version: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      # Secrets cannot be used in a job-level 'if', so this step turns "are they all set?" into a job output.
      - name: Maven Central configured?
        id: central
        env:
          HAS_SECRETS: ${{ secrets.CENTRAL_USERNAME != '' && secrets.CENTRAL_PASSWORD != '' && secrets.GPG_SECRET_KEY != '' && secrets.GPG_PUBLIC_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        run: |
          echo "enabled=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Maven Central secrets not set: publishing to GitHub Releases only (see docs/releasing.md)."
          fi

      - name: Build and test (all modules, Maven plugin ITs; Gradle plugin functional tests are gated by CI)
        run: mvn -B -ntp verify -DskipITs

      # -Prelease adds -sources and -javadoc jars (Maven Central needs them); the same staging repository becomes
      # the zip asset and, in the next job, the Maven Central bundle.
      - name: Stage Maven artifacts
        run: mvn -B -ntp -Prelease deploy -DskipTests -Dinvoker.skip -DaltDeploymentRepository=staging::file:${{ github.workspace }}/target/staging-repo

      - name: Keep the staging repository for the Maven Central job
        uses: actions/upload-artifact@v7
        with:
          name: staging-repo
          path: target/staging-repo
          retention-days: 7

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp springtune-check-cli/target/springtune-check-cli-$VERSION-all.jar dist/springtune-cli-$VERSION.jar
          cp LICENSE NOTICE target/staging-repo/
          (cd target/staging-repo && zip -qr ../../dist/springtune-maven-repo-$VERSION.zip .)
          rm target/staging-repo/LICENSE target/staging-repo/NOTICE
          cp LICENSE dist/LICENSE.txt
          # CycloneDX SBOM of every published module (written by -Prelease in the staging step above).
          cp target/springtune-$VERSION-sbom.cyclonedx.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
          java -jar dist/springtune-cli-$VERSION.jar --version | grep -q "SpringTune $VERSION"

      # The tag's tree must run its own CLI (iteration-7 brief row 2). Dispatch: a release commit whose parent is the
      # built commit and whose only change is action.yml's version default (and its "e.g." example), pushed as the
      # tag with this job's token (contents: write; actions/checkout keeps the token in the local git config, and
      # the repository has a branch ruleset but no tag ruleset). A push made with the job's token starts no
      # workflow, so this tag push does not run this workflow a second time. Nothing is pushed to a branch.
      # Pushed tag: it cannot be re-pointed here, so it must already be stamped.
      - name: Release commit and tag (action.yml defaults to this version)
        id: stamp
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}
        # The script is the built commit's own (the stamp script with it); see its header for every check.
        run: scripts/release/release-commit.sh "$VERSION" "$GITHUB_SHA" "$MODE"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMPED_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${TAG}.md"
          test -f "$NOTES"
          # The tag exists on origin in both paths: --verify-tag refuses to create one, so the release is on the
          # stamped commit and never on a tag gh would make from the default branch.
          gh release create "$TAG" dist/* --verify-tag --title "SpringTune $VERSION" --notes-file "$NOTES"
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [ "$target" = "$STAMPED_SHA" ] || { echo "::error::release $TAG resolves to $target, expected $STAMPED_SHA"; exit 1; }
          echo "Release $TAG is on $target"

  maven-central:
    name: Publish to Maven Central
    needs: release
    if: needs.release.outputs.central == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version (JReleaser reads it from the POM)
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - uses: actions/download-artifact@v8
        with:
          name: staging-repo
          path: target/staging-repo

      # Signs every file in memory (no gpg agent), adds checksums, runs Central's POM/sources/javadoc rules and
      # uploads one bundle. Stage defaults to UPLOAD: the deployment then waits on central.sonatype.com for a human
      # to press Publish. Set the repository variable CENTRAL_STAGE=FULL to publish without that step.
      - name: Deploy with JReleaser
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_STAGE: ${{ vars.CENTRAL_STAGE || 'UPLOAD' }}
        run: mvn -B -ntp -Prelease -N jreleaser:deploy -Dspringtune.central.stage="$CENTRAL_STAGE"

      - name: JReleaser logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-logs
          path: target/jreleaser/
          retention-days: 7
