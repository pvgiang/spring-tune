name: Benchmarks

# JMH overhead benchmarks (docs/benchmarks.md): sampler tick and limiter filter. Manual only: shared CI runners
# are noisy, so these numbers are indicative; the published ones name their machine. Never gates anything.
on:
  workflow_dispatch:
    inputs:
      jmh-args:
        description: "JMH options (java -jar benchmarks.jar -h)"
        required: false
        default: "-f 2 -wi 3 -i 5 -prof gc"

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the benchmarks jar
        run: mvn -B -ntp -Pbenchmarks package -DskipTests -Dinvoker.skip -pl springtune-benchmarks -am

      - name: Machine
        run: |
          { echo "## Machine"; echo '```'; nproc; grep -m1 "model name" /proc/cpuinfo; free -h | head -2; java -version 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run JMH
        # Explicit bash: the default run shell has no pipefail, so a failing JMH run piped into tee would pass.
        shell: bash
        env:
          JMH_ARGS: ${{ inputs.jmh-args }}
        run: |
          # JMH_ARGS is split on spaces on purpose (it is a list of options). -foe true: a benchmark that throws
          # (e.g. LimiterFilterBenchmark's "unexpected rejections" check) fails the run instead of being skipped.
          # shellcheck disable=SC2086
          java -jar springtune-benchmarks/target/benchmarks.jar $JMH_ARGS -foe true -rf json -rff jmh-result.json | tee jmh.txt
          { echo "## Results"; echo '```'; sed -n '/^Benchmark /,$p' jmh.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmh-results
          path: |
            jmh-result.json
            jmh.txt
          retention-days: 30
