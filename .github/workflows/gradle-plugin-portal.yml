name: Gradle Plugin Portal

# Publishes io.github.winky.springtune to plugins.gradle.org for an already released version.
# Run it by hand (Actions > Gradle Plugin Portal > Run workflow) AFTER the version is live on Maven Central:
# the plugin resolves springtune-check-engine from the user's repositories at check time, so publishing it
# earlier would hand users a plugin whose engine cannot be found. See docs/releasing.md#gradle-plugin-portal.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without the leading v (e.g. 0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Require the secrets and the engine on Maven Central
        env:
          VERSION: ${{ inputs.version }}
          HAS_SECRETS: ${{ secrets.GRADLE_PUBLISH_KEY != '' && secrets.GRADLE_PUBLISH_SECRET != '' }}
        run: |
          [ "$HAS_SECRETS" = "true" ] || { echo "::error::Set GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET (docs/releasing.md)"; exit 1; }
          URL="https://repo.maven.apache.org/maven2/io/github/winky/springtune/springtune-check-engine/$VERSION/springtune-check-engine-$VERSION.pom"
          curl -fsSI "$URL" > /dev/null || { echo "::error::$URL not found: publish to Maven Central first"; exit 1; }

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          gradle -p springtune-gradle-plugin/portal publishPlugins --no-configuration-cache \
            -PspringtuneVersion="$VERSION" \
            -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
