name: Gates collector

# Weekly snapshot of the adoption signals in docs/adoption/gates.md (stars with timestamps, issues by gate label,
# release asset downloads, Action users, and, with a PAT, the 14-day GitHub traffic) appended to the orphan branch
# `gates-data`. It never writes to main or any other branch. See docs/adoption/gates.md#collector.
#
# Two jobs, so the PAT and the write permission never share a job:
#   collect  read-only (contents: read, issues: read); the only job that sees GATES_TOKEN; uploads the snapshot.
#   store    contents: write with github.token only, no other secret; validates the snapshot, then pushes it.
on:
  schedule:
    - cron: "41 6 * * 1"      # weekly, Monday 06:41 UTC: inside the 14-day traffic window with a week to spare
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.repository == 'pvgiang/spring-tune'
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect
        env:
          REPO: ${{ github.repository }}
          # GATES_TOKEN (fine-grained PAT, this repository, Administration: read + Issues/Metadata: read) unlocks
          # traffic and code search across public repositories. Without it, GITHUB_TOKEN collects the rest.
          GH_TOKEN: ${{ secrets.GATES_TOKEN || github.token }}
          GATES_TOKEN: ${{ secrets.GATES_TOKEN }}
        run: |
          if [ -z "$GATES_TOKEN" ]; then
            echo "::notice::GATES_TOKEN not set: traffic (views, clones, referrers, paths) is not collected and is lost after 14 days. See docs/adoption/gates.md#collector."
          fi
          mkdir -p "$RUNNER_TEMP/gates-snapshot"
          scripts/gates/collect.sh "$RUNNER_TEMP/gates-snapshot/snapshot.json"
          {
            echo '## Gates snapshot'
            echo '```json'
            jq '{collected_at, auth, stars: .repository.stars, downloads: .releases.total_downloads,
                 action_users: .action_users.count, traffic: (.traffic.reason // "collected"),
                 unavailable: [to_entries[] | select(.value | type == "object" and .available == false) | .key]}' \
              "$RUNNER_TEMP/gates-snapshot/snapshot.json"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gates-snapshot
          path: ${{ runner.temp }}/gates-snapshot/snapshot.json
          if-no-files-found: error
          retention-days: 7

  store:
    needs: collect
    runs-on: ubuntu-latest
    if: github.repository == 'pvgiang/spring-tune'
    permissions:
      contents: write   # push to the gates-data branch only (explicit refspec below); no other secret in this job
    steps:
      - name: Download the snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gates-snapshot
          path: ${{ runner.temp }}/gates-snapshot

      - name: Validate the snapshot
        env:
          SNAPSHOT: ${{ runner.temp }}/gates-snapshot/snapshot.json
        run: |
          set -euo pipefail
          # The snapshot crosses a trust boundary (an artifact written by the job that holds the PAT), so only
          # a small JSON object with exactly the shape collect.sh writes is pushed.
          test -f "$SNAPSHOT" || { echo "::error::snapshot.json missing from the artifact"; exit 1; }
          size="$(stat -c %s "$SNAPSHOT")"
          [ "$size" -lt 1048576 ] || { echo "::error::snapshot is $size bytes (limit 1 MB)"; exit 1; }
          jq -e '
            type == "object"
            and (keys - ["schema","collected_at","repo","auth","repository","stargazers","issues","releases",
                         "action_users","traffic","not_collected"] | length == 0)
            and (["schema","collected_at","repo","auth","repository","stargazers","issues","releases",
                  "action_users","traffic","not_collected"] - keys | length == 0)
            and .schema == 1
            and (.collected_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and (.repo | type == "string")
            and ([.repository, .stargazers, .issues, .releases, .action_users, .traffic] | all(type == "object"))
            and (.not_collected | type == "array")
          ' "$SNAPSHOT" >/dev/null || { echo "::error::snapshot.json does not have the shape collect.sh writes"; exit 1; }
          echo "snapshot ok: $size bytes, collected_at $(jq -r .collected_at "$SNAPSHOT")"

      - name: Append to the gates-data branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SNAPSHOT: ${{ runner.temp }}/gates-snapshot/snapshot.json
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/gates-data"
          git init -q "$DATA"
          cd "$DATA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads origin gates-data >/dev/null; then
            git fetch -q --depth 1 origin gates-data
            git checkout -q -b gates-data FETCH_HEAD
          else
            echo "::notice::Creating the orphan branch gates-data"
            git checkout -q --orphan gates-data
            {
              echo "# gates-data"
              echo
              echo "Written only by .github/workflows/gates-collect.yml; see docs/adoption/gates.md#collector on main."
              echo "- snapshots/YYYY-MM-DDTHHMMSSZ.json: one full snapshot per run"
              echo "- snapshots.jsonl: the same snapshots, one per line, oldest first"
            } > README.md
          fi
          STAMP="$(jq -r '.collected_at' "$SNAPSHOT" | tr -d ':')"
          mkdir -p snapshots
          cp "$SNAPSHOT" "snapshots/$STAMP.json"
          jq -c . "$SNAPSHOT" >> snapshots.jsonl
          git add -A
          git commit -q -m "gates: snapshot $STAMP"
          git push -q origin HEAD:refs/heads/gates-data
