name: Rule request
description: A configuration or code pattern that caused (or nearly caused) an incident and that SpringTune should catch.
title: "[rule request] "
labels: ["rule-request"]
body:
  - type: markdown
    attributes:
      value: |
        The best rule requests start from something that actually broke. Remove anything confidential; this issue is public.
  - type: textarea
    id: incident
    attributes:
      label: What happened
      description: The symptom in production (latency, exhaustion, retries, OOM ...) and how you found the cause.
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: The config or code that caused it
      render: text
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: How it could be detected
      description: Which property, bean or call to look at, and the condition that should fire.
  - type: textarea
    id: safe-cases
    attributes:
      label: When it would be safe
      description: Setups where the same pattern is fine. These become the rule's "does not flag" tests.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connection pool (HikariCP, other DataSource)
        - Web server threads (Tomcat, Jetty, Undertow, Netty)
        - Executors / @Async / scheduling
        - HTTP clients and timeouts
        - Resilience4j / retries / circuit breakers
        - Transactions / queries
        - Kubernetes / Helm resources and probes
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where should it run?
      options:
        - CI check (static)
        - Runtime starter (live signals)
        - Both
        - Not sure
